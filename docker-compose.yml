version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: travelbilling-db
    restart: always
    environment:
      MYSQL_DATABASE: travelbillingdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  ai-service:
    build:
      context: ./ai
    container_name: travelbilling-ai
    restart: always
    ports:
      - "9001:9001"
    environment:
      - PORT=9001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - db

  backend:
    build:
      context: ./backend
    container_name: travelbilling-backend
    restart: always
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - DB_URL=jdbc:mysql://db:3306/travelbillingdb?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - AI_SERVICE_URL=http://ai-service:9001/api/ai
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - db
      - ai-service

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:9000/api}
    container_name: travelbilling-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
