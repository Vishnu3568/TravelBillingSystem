spring.datasource.url=jdbc:mysql://localhost:3306/travelbillingdb?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=9000

jwt.secret=travel-billing-default-secret-key-change-me-please-32chars
jwt.expiration-ms=86400000

# Bulk Import Configuration (Support for 250+ files)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=500MB
server.connection-timeout=600000
# AI Integration
google.ai.api-key=${GEMINI_API_KEY}
google.ai.model=${GEMINI_MODEL}
