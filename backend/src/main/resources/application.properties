spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travelbillingdb?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:9000}

jwt.secret=${JWT_SECRET:travel-billing-default-secret-key-change-me-please-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Bulk Import Configuration (Support for 250+ files)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=500MB
server.connection-timeout=600000
# AI Integration
google.ai.api-key=${GEMINI_API_KEY}
google.ai.model=${GEMINI_MODEL:gemini-1.5-flash}
google.ai.service-url=${AI_SERVICE_URL:http://localhost:9001/api/ai}
